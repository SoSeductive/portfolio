<div class="grid grid-cols-1 md:grid-cols-4 gap-4" @staggerFade>
  
  @for (project of projects(); track project.id) {
    <div [class.md:col-span-2]="project.isMain" 
         class="bento-card group bg-zinc-900 border border-zinc-800 p-6 rounded-3xl hover:border-zinc-400 transition-all duration-500">
      
      <div class="flex justify-between items-start mb-4">
        <span class="text-[10px] font-mono text-zinc-500 uppercase tracking-widest">{{ project.id }}</span>
        <a [href]="project.url" target="_blank" class="opacity-0 group-hover:opacity-100 transition-opacity">
          <span class="text-xs underline text-zinc-400">Visit Site ↗</span>
        </a>
      </div>

      <h3 class="text-2xl font-bold mb-2">{{ project.title }}</h3>
      <p class="text-zinc-400 text-sm mb-6 leading-relaxed">{{ project.description }}</p>

      <div class="flex flex-wrap gap-2">
        @for (tag of project.tech; track tag) {
          <span class="px-2 py-1 bg-zinc-800 text-[10px] text-zinc-300 rounded-md border border-zinc-700">
            {{ tag }}
          </span>
        }
      </div>
    </div>
  }

</div>
