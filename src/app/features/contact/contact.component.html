<section class="max-w-3xl mx-auto p-6" id="contact">
  <div class="bg-zinc-900 border border-zinc-800 p-8 rounded-3xl">
    <h2 class="text-3xl font-bold mb-6 italic tracking-tighter">Get in touch</h2>
    
    @if (status() === 'success') {
      <div class="bg-green-500/10 text-green-400 p-6 rounded-2xl border border-green-500/20">
        <p class="font-bold">Message sent successfully!</p>
        <p class="text-sm opacity-80 mt-1">I'll get back to you in Poznan [cite: 75] shortly.</p>
      </div>
    } @else {
      <form (submit)="$event.preventDefault(); onSubmit()" class="space-y-4">
        
        <div class="hidden">
          <input [(ngModel)]="honeypot" name="full_name" tabindex="-1" autocomplete="off">
        </div>

        <div class="space-y-1">
          <input 
            type="email" 
            [(ngModel)]="email" 
            name="email"
            placeholder="Your Email"
            [class.border-red-900]="email().length > 0 && !isEmailValid()"
            class="w-full bg-black border border-zinc-800 rounded-xl p-4 focus:border-white outline-none transition-all shadow-inner"
            required>
          @if (email().length > 0 && !isEmailValid()) {
            <span class="text-[10px] text-red-500 uppercase font-bold px-2">Invalid email address</span>
          }
        </div>
        
        <div class="space-y-1">
          <textarea 
            [(ngModel)]="message" 
            name="message"
            placeholder="Message (min. 10 characters)"
            rows="4"
            class="w-full bg-black border border-zinc-800 rounded-xl p-4 focus:border-white outline-none transition-all"
            required></textarea>
          <div class="text-[10px] text-zinc-600 text-right uppercase px-2">
            {{ message().length }} / 500
          </div>
        </div>

        <button 
          type="submit" 
          [disabled]="!isFormValid() || status() === 'sending'"
          class="w-full bg-white text-black font-black py-4 rounded-xl hover:bg-zinc-200 transition-all disabled:opacity-30 disabled:grayscale uppercase tracking-widest text-xs">
          {{ status() === 'sending' ? 'Connecting...' : 'Send Message' }}
        </button>
      </form>
    }
  </div>
</section>
